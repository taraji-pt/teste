
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    font-size: 12px;
    font-weight: normal;
    color: #ffffff;
  }
</style>
</head>
<body>
<div id="currentDateTime"></div>

<script>
function updateTime() {
  const now = new Date();

  let formatted = now.toLocaleString("pt-PT", {
    weekday: "long",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });

  formatted =
    formatted.charAt(0).toUpperCase() +
    formatted.slice(1);

  document.getElementById("currentDateTime")
    .textContent = formatted;
}

updateTime();
setInterval(updateTime, 1000);
</script>
</body>
</html>
